version: '3.8'

services:
  aura-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura_mental_chatbot
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - aura-db:/app/backend
    restart: unless-stopped

volumes:
  aura-db:

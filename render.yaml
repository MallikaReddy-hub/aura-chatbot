services:
  - type: web
    name: aura-mental-health-chatbot
    env: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
